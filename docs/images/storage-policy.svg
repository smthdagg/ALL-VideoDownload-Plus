<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">ALL VideoDownload Plus storage policy</title>
  <desc id="desc">Media is retained for a limited time, users receive a warning at 75 percent disk usage, and cleanup starts at 80 percent.</desc>
  <rect width="1200" height="360" fill="#0f1720"/>
  <text x="60" y="58" fill="#f4f7fb" font-family="Arial, sans-serif" font-size="28" font-weight="700">Storage policy</text>
  <text x="60" y="88" fill="#9fb2c7" font-family="Arial, sans-serif" font-size="16">Retention and disk pressure are visible to users and configurable in .env.</text>
  <rect x="85" y="150" width="1030" height="28" rx="14" fill="#243746"/>
  <rect x="85" y="150" width="772" height="28" rx="14" fill="#4c9d75"/>
  <rect x="857" y="150" width="206" height="28" fill="#d69b4c"/>
  <rect x="1063" y="150" width="52" height="28" rx="0 14 14 0" fill="#c65d62"/>
  <g font-family="Arial, sans-serif" font-size="16" text-anchor="middle">
    <text x="420" y="225" fill="#7bd1a1">Normal</text><text x="420" y="250" fill="#9fb2c7">below 75%</text>
    <text x="960" y="225" fill="#e7b76d">User warning</text><text x="960" y="250" fill="#9fb2c7">75% + /clean</text>
    <text x="1090" y="225" fill="#e8898d">Auto cleanup</text><text x="1090" y="250" fill="#9fb2c7">80% -> 70%</text>
  </g>
  <g fill="#1d3347" stroke="#4ea1d8" stroke-width="2">
    <rect x="210" y="285" width="230" height="45" rx="8"/><rect x="485" y="285" width="230" height="45" rx="8"/><rect x="760" y="285" width="230" height="45" rx="8"/>
  </g>
  <g fill="#f4f7fb" font-family="Arial, sans-serif" font-size="15" text-anchor="middle">
    <text x="325" y="313">Media: 120 minutes</text><text x="600" y="313">Metadata: 2 days</text><text x="875" y="313">Optional total cap: GB</text>
  </g>
</svg>
