<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>登录 - Telegram 下载 Bot 后台</title>
    <link rel="stylesheet" href="/static/private-users.css">
    <style>
        .login-page { min-height: 100vh; display: grid; place-items: center; padding: 20px; background: #eef3f0; }
        .login-panel { width: min(400px, 100%); border: 1px solid var(--line); background: var(--paper); padding: 28px; border-radius: 8px; }
        .login-brand { margin-bottom: 24px; }
        .login-language { display: flex; justify-content: flex-end; margin-bottom: 18px; }
        .login-brand h1 { color: var(--ink); font-size: 24px; }
        .login-brand p:last-child { margin: 8px 0 0; color: var(--muted); font-size: 13px; line-height: 1.5; }
        .login-panel .field { margin-bottom: 16px; }
        .login-panel .button { width: 100%; margin-top: 4px; }
        .login-error { margin: 16px 0 0; border: 1px solid #efb5af; background: var(--danger-wash); color: var(--danger); padding: 10px 12px; border-radius: 6px; font-size: 13px; }
    </style>
</head>
<body>
<main class="login-page">
    <section class="login-panel" aria-labelledby="login-title">
        <div class="login-language language-switch" id="login-language-switch" aria-label="语言切换">
            <button type="button" data-login-language="zh">中文</button>
            <button type="button" data-login-language="en">EN</button>
        </div>
        <header class="login-brand">
            <p class="eyebrow" data-login-i18n="brand">Telegram 下载 Bot</p>
            <h1 id="login-title" data-login-i18n="title">管理后台登录</h1>
            <p data-login-i18n="hint">使用配置文件中的后台用户名和密码，不是 Telegram 用户名或数字 ID。</p>
        </header>
        <form id="login-form">
            <div class="field">
                <label for="username" data-login-i18n="username">后台用户名</label>
                <input id="username" name="username" autocomplete="username" required autofocus>
            </div>
            <div class="field">
                <label for="password" data-login-i18n="password">后台密码</label>
                <input id="password" name="password" type="password" autocomplete="current-password" required>
            </div>
            <button class="button button--primary" id="login-button" type="submit" data-login-i18n="login">登录</button>
            <p class="login-error" id="login-error" role="alert" hidden></p>
        </form>
    </section>
</main>
<script>
const loginTranslations = {
    zh: { brand: "Telegram 下载 Bot", title: "管理后台登录", hint: "使用配置文件中的后台用户名和密码，不是 Telegram 用户名或数字 ID。", username: "后台用户名", password: "后台密码", login: "登录", logging: "正在登录...", invalid: "用户名或密码错误。", network: "无法连接后台，请稍后重试。", language: "语言切换" },
    en: { brand: "Telegram Download Bot", title: "Administration login", hint: "Use the dashboard username and password from configuration, not a Telegram username or numeric ID.", username: "Dashboard username", password: "Dashboard password", login: "Log in", logging: "Logging in...", invalid: "Invalid username or password.", network: "Could not connect to the dashboard. Try again later.", language: "Language switch" },
};
let loginLanguage = localStorage.getItem("adminLanguage") || (navigator.language.toLowerCase().startsWith("zh") ? "zh" : "en");
const loginText = (key) => loginTranslations[loginLanguage][key];
function applyLoginLanguage() {
    document.documentElement.lang = loginLanguage === "zh" ? "zh-CN" : "en";
    document.querySelectorAll("[data-login-i18n]").forEach((element) => { element.textContent = loginText(element.dataset.loginI18n); });
    document.querySelectorAll("[data-login-language]").forEach((button) => button.classList.toggle("active", button.dataset.loginLanguage === loginLanguage));
    document.getElementById("login-language-switch").setAttribute("aria-label", loginText("language"));
    document.title = `${loginText("title")} - Telegram Download Bot`;
}
document.querySelectorAll("[data-login-language]").forEach((button) => button.addEventListener("click", () => {
    loginLanguage = button.dataset.loginLanguage;
    localStorage.setItem("adminLanguage", loginLanguage);
    applyLoginLanguage();
}));
applyLoginLanguage();
document.getElementById("login-form").addEventListener("submit", async (event) => {
    event.preventDefault();
    const button = document.getElementById("login-button");
    const error = document.getElementById("login-error");
    button.disabled = true;
    button.textContent = loginText("logging");
    error.hidden = true;
    try {
        const response = await fetch("/api/login", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
                username: document.getElementById("username").value.trim(),
                password: document.getElementById("password").value,
            }),
        });
        if (response.ok) {
            window.location.href = "/admin/users";
            return;
        }
        error.textContent = loginText("invalid");
        error.hidden = false;
    } catch (_) {
        error.textContent = loginText("network");
        error.hidden = false;
    } finally {
        button.disabled = false;
        button.textContent = loginText("login");
    }
});
</script>
</body>
</html>
